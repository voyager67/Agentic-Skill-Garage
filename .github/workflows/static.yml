name: Deploy approved static site files to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Stage approved public site files
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html README.md PRIVACY.md SECURITY.md LICENSE skills-index.json .nojekyll _site/
          cp assets/agentic-skill-garage-hero.svg assets/agentic-skill-garage-preview.gif assets/agentic-skill-garage-demo.mp4 assets/workflow-overview.svg _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
